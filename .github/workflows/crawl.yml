name: crawl
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: crawl
  cancel-in-progress: false
# The job only reads the repo; GITHUB_TOKEN gets nothing else.
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No job-level env: secrets are scoped to the steps that need them, so dependency
    # code that runs during install never sees them.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: no dependency lifecycle scripts run at all. esbuild (used by tsx and
      # drizzle-kit) loads its prebuilt @esbuild/<platform> optional package without postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SITE_URL: ${{ secrets.SITE_URL }}
